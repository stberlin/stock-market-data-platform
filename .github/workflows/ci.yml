name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_password
          POSTGRES_DB: stocks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      STOCK_DB_USER: stock_user
      STOCK_DB_PASSWORD: stock_password
      STOCK_DB_HOST: localhost
      STOCK_DB_PORT: 5432
      STOCK_DB_NAME: stocks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Initialize database
        run: python -m src.database.init_db

      - name: Run tests
        run: pytest -v
