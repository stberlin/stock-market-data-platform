services:

  # ------------------------
  # AIRFLOW METADATA DB
  # ------------------------
  airflow_postgres:
    image: postgres:16
    container_name: airflow_db

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"


  # ------------------------
  # STOCK DATABASE (DEINE DATEN)
  # ------------------------
  stock_postgres:
    image: postgres:16
    container_name: stock_postgres

    environment:
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password
      POSTGRES_DB: stocks

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  # ------------------------
  # PGADMIN (für STOCK DB)
  # ------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: stock_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - stock_postgres


  # ------------------------
  # AIRFLOW INIT
  # ------------------------
  airflow-init:
    image: apache/airflow:2.9.3

    depends_on:
      - airflow_postgres
    
    env_file:
      - .env

    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-secret-key-2026-dev"
      PYTHONPATH: /opt/airflow
      DB_HOST: stock_postgres

    entrypoint: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname a --role Admin --email admin@test.com
      "
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src


  # ------------------------
  # AIRFLOW WEB
  # ------------------------
  airflow:
    image: apache/airflow:2.9.3

    depends_on:
      - airflow_postgres
      - airflow-init
    
    env_file:
      - .env

    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-secret-key-2026-dev"
      PYTHONPATH: /opt/airflow
      DB_HOST: stock_postgres

    ports:
      - "8080:8080"

    command: webserver

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src


  # ------------------------
  # AIRFLOW SCHEDULER
  # ------------------------
  airflow-scheduler:
    image: apache/airflow:2.9.3

    depends_on:
      - airflow_postgres
      - airflow-init
    
    env_file:
      - .env

    environment:
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: "airflow-secret-key-2026-dev"
      PYTHONPATH: /opt/airflow
      DB_HOST: stock_postgres

    command: scheduler
    volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src


volumes:
  postgres_data:
